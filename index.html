<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RoPHe Clicker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --coin-gold: #f59e0b;
        }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .timer-box {
            font-size: 13px;
            color: #94a3b8;
            text-align: left;
        }
        .claim-btn {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .claim-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .game-core {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .user-greeting {
            font-size: 17px;
            margin: 0;
            font-weight: 600;
        }
        .username-highlight {
            color: #38bdf8;
        }
        .score-board {
            font-size: 48px;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin: 2px 0;
        }
        .stats-row {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 8px;
        }
        .coin-wrapper {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            position: relative;
            outline: none;
            transition: transform 0.1s ease;
            margin: 5px 0;
        }
        .coin-wrapper:active {
            transform: scale(0.93);
        }
        .coin-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f59e0b, #b45309);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fef3c7;
        }
        .coin-circle img {
            width: 55%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }
        .footer-actions {
            width: 100%;
            display: flex;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }
        .btn-action:hover {
            background: rgba(51, 65, 85, 0.8);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            color: white;
        }
        .btn-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <!-- የላይኛው የክላይም እና የቦነስ ሰዓት ክፍል -->
    <div class="header-container">
        <div class="timer-box">
            <div style="font-size: 10px;">የቀኑ ክላይም ቦነስ</div>
            <div id="claimTimer" style="font-weight: bold; color: #fff;">00:00</div>
        </div>
        <button class="claim-btn" id="claimBtn" disabled>ክላይም (+1000)</button>
    </div>

    <!-- የመሃል ዋና የጨዋታ ማዕከል -->
    <div class="game-core">
        <h2 class="user-greeting">ሰላም፣ <span class="username-highlight" id="username">ተጠቃሚ</span> 👋</h2>
        <div class="score-board" id="score">0</div>
        
        <div class="stats-row">
            <span>የጋበዝካቸው: <b id="inviteCount" style="color:#38bdf8;">0</b>/3</span>
            <span>ሽልማት: <b id="rewardStatus" style="color:#f59e0b;">ሊጠብቅ ነው</b></span>
        </div>

        <p style="color: #94a3b8; font-size: 13px; margin: 0;">ሳንቲሙን በመንካት ነጥብ ይሰብስቡ</p>

        <!-- የሳንቲም ምስል አዝራር -->
        <button class="coin-wrapper" id="clickBtn">
            <div class="coin-circle">
                <img src="https://cdn-icons-png.flaticon.com/512/8148/8148139.png" alt="Coin Logo">
            </div>
        </button>
    </div>

    <!-- የታችኛዎቹ ጓደኛ መጋበዣ (Invite) እና ተልእኮዎች (Tasks) ቁልፎች -->
    <div class="footer-actions">
        <a href="#" class="btn-action btn-primary" id="inviteBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Invite" class="btn-icon">
            3 ጓደኛ ጋብዙ (+3000)
        </a>
        <button class="btn-action" id="tasksBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/2666/2666500.png" alt="Tasks" class="btn-icon">
            ተልእኮዎች
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let userId = "12345";
        if (user) {
            if (user.first_name) {
                document.getElementById("username").innerText = user.first_name;
            }
            if (user.id) {
                userId = user.id;
            }
        }

        // ነጥቦች እና የኢንቫይት ቁጥር ከ localStorage መጫን
        let score = parseInt(localStorage.getItem('ropi_score')) || 0;
        let inviteCount = parseInt(localStorage.getItem('ropi_invites')) || 0;
        let rewardClaimed = localStorage.getItem('ropi_reward_claimed') === 'true';

        const scoreDisplay = document.getElementById("score");
        const inviteCountDisplay = document.getElementById("inviteCount");
        const rewardStatusDisplay = document.getElementById("rewardStatus");

        scoreDisplay.innerText = score;
        inviteCountDisplay.innerText = inviteCount;

        if(rewardClaimed) {
            rewardStatusDisplay.innerText = "ተወስዷል ✅";
            rewardStatusDisplay.style.color = "#22c55e";
        }

        // የክሊክ ሰሌዳ ተግባር
        const clickBtn = document.getElementById("clickBtn");
        clickBtn.addEventListener("click", () => {
            score += 1;
            scoreDisplay.innerText = score;
            localStorage.setItem('ropi_score', score);

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("light");
            }
        });

        // የክላይም (Claim) ሰዓት ቆጣሪ ስርዓት (ለዕለት ተዕለት ኮይን - 1 ደቂቃ ወይም እንደ አስፈላጊነቱ)
        let claimSeconds = parseInt(localStorage.getItem('ropi_claim_time')) || 60; 
        const timerDisplay = document.getElementById("claimTimer");
        const claimBtn = document.getElementById("claimBtn");

        function updateClaimTimer() {
            let m = Math.floor(claimSeconds / 60);
            let s = claimSeconds % 60;
            timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            if (claimSeconds <= 0) {
                timerDisplay.innerText = "ክላይም ዝግጁ ነው!";
                claimBtn.disabled = false;
            } else {
                claimSeconds--;
                localStorage.setItem('ropi_claim_time', claimSeconds);
                setTimeout(updateClaimTimer, 1000);
            }
        }
        updateClaimTimer();

        claimBtn.addEventListener("click", () => {
            score += 1000; // የቀኑ ክላይም ቦነስ
            scoreDisplay.innerText = score;
            localStorage.setItem('ropi_score', score);
            
            claimBtn.disabled = true;
            claimSeconds = 300; // ለቀጣይ ጊዜ 5 ደቂቃ
            localStorage.setItem('ropi_claim_time', claimSeconds);
            updateClaimTimer();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred("success");
            }
            alert("የቀኑ ክላይም ቦነስ 1000 ሳንቲም ተጨመረልዎ! 🎉");
        });

        // የ 3 ጓደኛ ኢንቫይት ስርዓት
        const botUsername = "my_clicker_game_2026_bot";
        const inviteLink = `https://t.me/share/url?url=https://t.me/${botUsername}?start=ref_${userId}&text=ና!%20ይህን%20አሪፍ%20ጨዋታ%20ተጫወትና%20ሳንቲም%20ሰብስብ!`;
        
        document.getElementById("inviteBtn").addEventListener("click", (e) => {
            e.preventDefault();
            window.open(inviteLink, '_blank');
            
            // ለሙከራ (Test) ጓደኛ ሲጋብዝ ቁጥሩ እንዲጨምር ማድረግ ይቻላል 
            // (በእውነተኛ ሰርቨር ሲሆን በቶክን ይረጋገጣል)
        });

        document.getElementById("tasksBtn").addEventListener("click", () => {
            alert("ሶስት ጓደኞችዎን በመጋበዝ 3000 ሳንቲም ሽልማት ያግኙ! ሊንኩን በመጫን ለጓደኞችዎ ይላኩ።");
        });
    </script>
</body>
</html>
